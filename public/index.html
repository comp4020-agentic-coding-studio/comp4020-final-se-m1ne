<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shared canvas</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="room-bar">
      <div id="public-room-controls">
        <button id="create-room-button" type="button">Create private room</button>
        <form id="join-room-form">
          <input id="join-room-code" type="text" maxlength="6" placeholder="Room code" aria-label="Room code" />
          <button type="submit">Join</button>
        </form>
      </div>
      <div id="private-room-controls" hidden>
        <span id="room-code-label"></span>
        <a href="/" id="back-to-public">Back to Public Canvas</a>
      </div>
      <button id="undo-button" type="button" title="Undo (Ctrl+Z)">Undo</button>
      <button id="redo-button" type="button" title="Redo (Ctrl+Y)">Redo</button>
    </div>
    <div id="toolbar">
      <div id="tool-mode">
        <button id="tool-brush" class="tool-button selected" aria-pressed="true">Brush</button>
        <button id="tool-eraser" class="tool-button" aria-pressed="false">Eraser</button>
      </div>
      <div id="palette">
        <button class="swatch selected" data-color="#1d1d1d" style="background:#1d1d1d" aria-label="black"></button>
        <button class="swatch" data-color="#e53935" style="background:#e53935" aria-label="red"></button>
        <button class="swatch" data-color="#1e88e5" style="background:#1e88e5" aria-label="blue"></button>
        <button class="swatch" data-color="#43a047" style="background:#43a047" aria-label="green"></button>
        <button class="swatch" data-color="#fdd835" style="background:#fdd835" aria-label="yellow"></button>
        <label class="swatch custom-swatch" aria-label="custom colour">
          <input type="color" id="custom-color" value="#1d1d1d" />
        </label>
      </div>
      <div id="tool-size">
        <label for="tool-size-slider">Size</label>
        <input type="range" id="tool-size-slider" min="1" max="40" value="6" step="1" />
        <output id="tool-size-value" for="tool-size-slider">6px</output>
      </div>
    </div>
    <canvas id="canvas"></canvas>
    <div id="tool-cursor" aria-hidden="true"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
