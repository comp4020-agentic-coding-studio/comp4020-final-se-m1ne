<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shared canvas</title>
    <link rel="stylesheet" href="/theme-tokens.css" />
    <link rel="stylesheet" href="/shared-ui.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="workspace">
      <div id="session-bar">
        <div id="brand">Shared Canvas</div>
        <!-- Right-aligned navigation, two rows sharing one right edge. Row 1:
             Home, Profile, Help (plus Document for a pixel-art room). Row 2:
             Create Private Room + room-code Join on Public, Back to Public
             Canvas in a Private Room. -->
        <div id="action-row-right">
          <div id="nav-primary" class="nav-row">
            <!-- Voluntary way back to the landing page (public/landing.html) --
                 a plain link, no JS needed. -->
            <a href="/" id="home-link" class="app-button" title="Back to the landing page">Home</a>
            <!-- Freehand-only (public/app.js reveals and wires this; never
                 touched by public/pixel-editor.js, so it stays hidden for an
                 existing pixel-art room). -->
            <button
              id="profile-button"
              type="button"
              class="app-button"
              hidden
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="profile-popover"
            >
              Profile
            </button>
            <!-- Shown for both Public and Private, legacy and pixel-editor
                 alike (public/help-popover.js is wired from both public/app.js
                 and public/pixel-editor.js). -->
            <button
              id="help-button"
              type="button"
              class="app-button"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="help-popover"
            >
              Help
            </button>
            <!-- Opens #document-settings-popover (dimensions + Grid toggle) --
                 shown for pixel-art pages only, never for a legacy room
                 (public/app.js never shows or touches it). -->
            <button
              type="button"
              id="document-settings-button"
              class="app-button"
              hidden
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="document-settings-popover"
            >
              Document
            </button>
          </div>
          <div id="session-controls" class="nav-row">
            <div id="public-room-controls" class="session-group">
              <button
                id="create-room-button"
                type="button"
                class="app-button"
                aria-haspopup="dialog"
                aria-expanded="false"
                aria-controls="room-create-popover"
              >
                Create Private Room
              </button>
              <form id="join-room-form" class="join-control">
                <input id="join-room-code" type="text" maxlength="6" placeholder="Room code" aria-label="Room code" />
                <button type="submit" class="app-button">Join</button>
              </form>
            </div>
            <div id="private-room-controls" class="session-group" hidden>
              <a href="/canvas" id="back-to-public" class="app-button">Back to Public Canvas</a>
            </div>
          </div>
        </div>
      </div>

      <div id="editor-body">
        <div id="tool-ribbon">
          <div id="tool-group">
            <button id="tool-brush" class="tool-button selected" aria-pressed="true" aria-label="Brush" title="Brush">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                <path d="M20 2 L22 4 L11 15 L9 13 Z" fill="currentColor" />
                <path
                  d="M9 13 L11 15 C11 15 10 17 8 19 C6 21 4 21 4 19 C4 17 7 15 9 13 Z"
                  fill="currentColor"
                />
                <circle cx="5" cy="21.2" r="1" fill="currentColor" />
              </svg>
            </button>
            <button id="tool-eraser" class="tool-button" aria-pressed="false" aria-label="Eraser" title="Eraser">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                <g transform="rotate(45 12 12)">
                  <rect x="5" y="8.5" width="14" height="7" rx="1.6" fill="currentColor" />
                  <rect x="5" y="8.5" width="4" height="7" rx="1.6" fill="currentColor" opacity="0.45" />
                </g>
              </svg>
            </button>
          </div>
        </div>

        <div id="canvas-column">
          <div id="canvas-toolbar">
            <div id="history-controls" class="action-group">
              <button id="undo-button" type="button" class="app-button icon-button" aria-label="Undo" title="Undo">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                  <path d="M4 12 L9.2 8.2 L9.2 15.8 Z" fill="currentColor" />
                  <path
                    d="M9 12 C9 7 13 5 17 6.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.2"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
              <button id="redo-button" type="button" class="app-button icon-button" aria-label="Redo" title="Redo">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                  <path d="M20 12 L14.8 8.2 L14.8 15.8 Z" fill="currentColor" />
                  <path
                    d="M15 12 C15 7 11 5 7 6.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.2"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
            </div>
            <!-- "Public Canvas" by default; public/app.js and
                 public/pixel-editor.js set "Private Room · CODE" on a room page. -->
            <span id="room-code-label">Public Canvas</span>
          </div>

          <div id="canvas-viewport">
            <canvas id="canvas"></canvas>
            <!-- Freehand-only: renders OTHER participants' strokes while
                 they're still being dragged (public/app.js's
                 remoteStrokePreviews/handleRemoteStrokeEvent). Sized/positioned
                 in JS to track #canvas's own CSS box exactly, at any zoom/pan,
                 and never drawn to from #canvas's own 2D context or any owner's
                 real layer -- a separate backing store entirely, so nothing
                 painted here can ever become, or be mistaken for, persisted
                 artwork. Unused (left untouched) by public/pixel-editor.js. -->
            <canvas id="remote-stroke-preview" aria-hidden="true"></canvas>
            <!-- Pure CSS/DOM overlay, positioned in JS by public/pixel-editor.js
                 to track the canvas's own CSS box at the current zoom -- never
                 drawn into #canvas's own 2D context, so it can never
                 contaminate stored artwork. Unused (left hidden) by
                 public/app.js. -->
            <div id="pixel-grid-overlay" aria-hidden="true" hidden></div>
            <!-- Freehand-only (public/pixel-editor.js never adds anything here):
                 one small absolutely-positioned marker per OTHER participant
                 currently showing a cursor, created/moved/removed entirely by
                 public/app.js. Never drawn into #canvas's own 2D context, so a
                 cursor can never become, or be mistaken for, saved artwork. -->
            <div id="remote-cursors" aria-hidden="true"></div>
          </div>

          <div id="status-bar">
            <div class="size-control">
              <label for="tool-size-slider" class="size-label">Brush size</label>
              <input type="range" id="tool-size-slider" min="1" max="100" value="6" step="1" />
              <output id="tool-size-value" for="tool-size-slider">6px</output>
              <!-- Pixel mode's own direct numeric input, alongside (not
                   instead of) the slider -- public/app.js's #tool-size-value
                   stays a plain read-only <output>, unaffected; this is a
                   separate, additional control only pixel-editor.js shows. -->
              <input
                type="number"
                id="tool-size-number"
                min="1"
                max="100"
                step="1"
                value="2"
                aria-label="Brush size in pixels"
                hidden
              />
            </div>
          <div id="zoom-controls">
            <button id="zoom-out-button" type="button" class="app-button icon-button" aria-label="Zoom out" title="Zoom out">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
                <circle cx="10.5" cy="10.5" r="7" fill="none" stroke="currentColor" stroke-width="2" />
                <line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <line x1="7.2" y1="10.5" x2="13.8" y2="10.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </button>
            <!-- Continuous, logarithmically-mapped zoom (see public/pixeldoc.js's
                 zoomToSliderPosition/sliderPositionToZoom): position 0-1000 maps
                 onto the current scope's own [10%, 800% or 3200%] range. Kept in
                 sync with the buttons/percentage/Fit/wheel-zoom through the one
                 shared applyZoom function -- never a second zoom state. -->
            <input type="range" id="zoom-slider" min="0" max="1000" step="1" value="0" aria-label="Zoom level" />
            <output id="zoom-percent" for="zoom-out-button zoom-in-button" aria-live="polite">100%</output>
            <button id="zoom-in-button" type="button" class="app-button icon-button" aria-label="Zoom in" title="Zoom in">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
                <circle cx="10.5" cy="10.5" r="7" fill="none" stroke="currentColor" stroke-width="2" />
                <line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <line x1="7.2" y1="10.5" x2="13.8" y2="10.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                <line x1="10.5" y1="7.2" x2="10.5" y2="13.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </button>
            <button id="fit-button" type="button" class="app-button" title="Fit document to workspace">Fit</button>
          </div>
          </div>
        </div>

        <div id="colour-group">
          <span class="group-label">Colours</span>
          <div class="group-controls">
            <div id="colour-current" aria-hidden="true"></div>
            <button
              type="button"
              id="edit-colour-button"
              class="tool-button"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="colour-popover"
              aria-label="Edit colour"
              title="Edit colour"
            >
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                <path
                  d="M12 3 C6.5 3 2 6.8 2 11.5 C2 15 4.5 16.5 7 16.2 C7.9 16.1 8.6 16.7 8.6 17.6 C8.6 18.2 8.3 18.6 8.3 19.2 C8.3 20.4 9.3 21 10.5 21 C16.8 21 22 16.9 22 11.5 C22 6.8 17.5 3 12 3 Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <circle cx="7.5" cy="9.5" r="1.3" fill="currentColor" />
                <circle cx="12" cy="7" r="1.3" fill="currentColor" />
                <circle cx="16.5" cy="9.5" r="1.3" fill="currentColor" />
                <circle cx="17.5" cy="14" r="1.3" fill="currentColor" />
              </svg>
            </button>
            <button id="tool-eyedropper" class="tool-button" aria-pressed="false" aria-label="Eyedropper" title="Eyedropper">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                <path d="M20 3 L21.5 4.5 L12 14 L10.5 12.5 Z" fill="currentColor" />
                <rect
                  x="9.6"
                  y="12.3"
                  width="3.6"
                  height="1.6"
                  rx="0.4"
                  fill="currentColor"
                  transform="rotate(45 11.4 13.1)"
                />
                <circle cx="7.4" cy="18.6" r="1.15" fill="currentColor" />
              </svg>
            </button>
          </div>
          <!-- Drawing-colour presets. Each .swatch[data-color] is wired by
               public/colour-picker-ui.js to the existing colour state (click
               sets the brush colour; an exact match is marked selected, a
               custom colour leaves all unselected). -->
          <div id="palette" role="group" aria-label="Preset drawing colours">
            <button type="button" class="swatch" data-color="#FFFFFF" style="background:#FFFFFF" aria-label="White" title="White"></button>
            <button type="button" class="swatch" data-color="#F7E8C8" style="background:#F7E8C8" aria-label="Cream" title="Cream"></button>
            <button type="button" class="swatch" data-color="#D6B58A" style="background:#D6B58A" aria-label="Tan" title="Tan"></button>
            <button type="button" class="swatch" data-color="#C9C9C9" style="background:#C9C9C9" aria-label="Light grey" title="Light grey"></button>
            <button type="button" class="swatch" data-color="#808080" style="background:#808080" aria-label="Grey" title="Grey"></button>
            <button type="button" class="swatch" data-color="#F2B5A7" style="background:#F2B5A7" aria-label="Peach" title="Peach"></button>
            <button type="button" class="swatch" data-color="#E59BB8" style="background:#E59BB8" aria-label="Pink" title="Pink"></button>
            <button type="button" class="swatch" data-color="#E85D5D" style="background:#E85D5D" aria-label="Red" title="Red"></button>
            <button type="button" class="swatch" data-color="#C94C4C" style="background:#C94C4C" aria-label="Dark red" title="Dark red"></button>
            <button type="button" class="swatch" data-color="#986747" style="background:#986747" aria-label="Brown" title="Brown"></button>
            <button type="button" class="swatch" data-color="#F29A58" style="background:#F29A58" aria-label="Orange" title="Orange"></button>
            <button type="button" class="swatch" data-color="#E8A83D" style="background:#E8A83D" aria-label="Amber" title="Amber"></button>
            <button type="button" class="swatch" data-color="#F4D35E" style="background:#F4D35E" aria-label="Yellow" title="Yellow"></button>
            <button type="button" class="swatch" data-color="#A9C96B" style="background:#A9C96B" aria-label="Lime green" title="Lime green"></button>
            <button type="button" class="swatch" data-color="#477B57" style="background:#477B57" aria-label="Forest green" title="Forest green"></button>
            <button type="button" class="swatch" data-color="#55B78B" style="background:#55B78B" aria-label="Green" title="Green"></button>
            <button type="button" class="swatch" data-color="#54BFC5" style="background:#54BFC5" aria-label="Teal" title="Teal"></button>
            <button type="button" class="swatch" data-color="#2D777D" style="background:#2D777D" aria-label="Dark teal" title="Dark teal"></button>
            <button type="button" class="swatch" data-color="#579BDD" style="background:#579BDD" aria-label="Blue" title="Blue"></button>
            <button type="button" class="swatch" data-color="#355C9A" style="background:#355C9A" aria-label="Navy blue" title="Navy blue"></button>
            <button type="button" class="swatch" data-color="#7976D2" style="background:#7976D2" aria-label="Indigo" title="Indigo"></button>
            <button type="button" class="swatch" data-color="#684B91" style="background:#684B91" aria-label="Dark purple" title="Dark purple"></button>
            <button type="button" class="swatch" data-color="#B77BCB" style="background:#B77BCB" aria-label="Purple" title="Purple"></button>
            <button type="button" class="swatch" data-color="#5B4035" style="background:#5B4035" aria-label="Dark brown" title="Dark brown"></button>
            <button type="button" class="swatch" data-color="#1D1D1D" style="background:#1D1D1D" aria-label="Black" title="Black"></button>
          </div>
        </div>
      </div>
    </div>

    <div id="colour-popover" role="dialog" aria-label="Edit colour" hidden>
      <div id="colour-popover-header">
        <span>Edit colour</span>
        <button type="button" id="colour-popover-close" aria-label="Close colour editor">&times;</button>
      </div>
      <div id="colour-popover-body">
        <canvas id="colour-wheel" width="180" height="180" aria-label="Hue and saturation/value colour picker"></canvas>
        <div id="colour-preview-row">
          <span id="colour-preview-swatch" aria-hidden="true"></span>
          <span id="colour-preview-hex"></span>
        </div>
        <div class="colour-fields" id="colour-rgb-fields">
          <div class="colour-field">
            <label for="rgb-r-slider">R</label>
            <input type="range" id="rgb-r-slider" min="0" max="255" step="1" />
            <input type="number" id="rgb-r-number" min="0" max="255" step="1" />
          </div>
          <div class="colour-field">
            <label for="rgb-g-slider">G</label>
            <input type="range" id="rgb-g-slider" min="0" max="255" step="1" />
            <input type="number" id="rgb-g-number" min="0" max="255" step="1" />
          </div>
          <div class="colour-field">
            <label for="rgb-b-slider">B</label>
            <input type="range" id="rgb-b-slider" min="0" max="255" step="1" />
            <input type="number" id="rgb-b-number" min="0" max="255" step="1" />
          </div>
        </div>
        <div class="colour-fields" id="colour-hsv-fields">
          <div class="colour-field">
            <label for="hsv-h-slider">H</label>
            <input type="range" id="hsv-h-slider" min="0" max="360" step="1" />
            <input type="number" id="hsv-h-number" min="0" max="360" step="1" />
          </div>
          <div class="colour-field">
            <label for="hsv-s-slider">S</label>
            <input type="range" id="hsv-s-slider" min="0" max="100" step="1" />
            <input type="number" id="hsv-s-number" min="0" max="100" step="1" />
          </div>
          <div class="colour-field">
            <label for="hsv-v-slider">V</label>
            <input type="range" id="hsv-v-slider" min="0" max="100" step="1" />
            <input type="number" id="hsv-v-number" min="0" max="100" step="1" />
          </div>
        </div>
      </div>
    </div>

    <!-- The New Canvas dialog: independent width/height and a background
         choice, confirmed before a Private pixel-art studio is created --
         never a permanently-visible toolbar control, and width/height are
         never editable again afterward (server/db.js's own immutability).
         Same popover chrome as #colour-popover (shared tokens, same
         structure), wired only by public/pixel-editor.js (the Public page is
         always pixel mode, so this is the only place a NEW room is ever
         created; public/app.js never opens it). -->
    <div id="room-create-popover" role="dialog" aria-label="New canvas" hidden>
      <div id="room-create-popover-header">
        <span>New canvas</span>
        <button type="button" id="room-create-popover-close" aria-label="Close">&times;</button>
      </div>
      <div id="room-create-popover-body">
        <div class="new-canvas-field">
          <label for="new-canvas-width">Width</label>
          <input type="number" id="new-canvas-width" min="16" max="2048" step="1" value="128" />
        </div>
        <div class="new-canvas-field">
          <label for="new-canvas-height">Height</label>
          <input type="number" id="new-canvas-height" min="16" max="2048" step="1" value="128" />
        </div>
        <div id="room-create-popover-actions">
          <button type="button" id="room-create-cancel" class="app-button">Cancel</button>
          <button type="button" id="room-create-confirm" class="app-button">Create</button>
        </div>
      </div>
    </div>

    <!-- Document settings: read-only dimensions and a Grid toggle for BOTH
         Public and Private, plus (relocated here only for a pixel-art room)
         room code -- a compact popover
         (triggered by #document-settings-button in the session bar) instead
         of a full-width persistent row. public/pixel-editor.js relocates
         #room-code-label into this body for a pixel-art room; never touched by
         public/app.js (legacy rooms keep showing their own inline, and never
         see this popover at all -- #document-settings-button stays hidden
         for them). -->
    <div id="document-settings-popover" role="dialog" aria-label="Document settings" hidden>
      <div id="document-settings-header">
        <span>Document</span>
        <button type="button" id="document-settings-close" aria-label="Close">&times;</button>
      </div>
      <div id="document-settings-body">
        <div class="document-settings-row">
          <span class="group-label">Size</span>
          <span id="document-dimensions"></span>
        </div>
        <div class="document-settings-row">
          <span class="group-label">Grid</span>
          <!-- Reflects the user's own ON/OFF preference (defaults ON,
               persisted in localStorage) -- separate from the automatic,
               temporary low-zoom suppression public/pixel-editor.js also
               applies, which never changes this toggle's own state. -->
          <button type="button" id="grid-toggle" class="app-button" aria-pressed="true">On</button>
        </div>
      </div>
    </div>

    <!-- Freehand-only (public/app.js shows and wires all of this; never
         touched by public/pixel-editor.js). Edits the same nickname/cursor-
         colour/visibility preferences the one-time setup modal below
         collects, reusing the exact same POST /api/me/profile endpoint. -->
    <div id="profile-popover" role="dialog" aria-label="Profile settings" hidden>
      <div id="profile-popover-header">
        <span>Profile</span>
        <button type="button" id="profile-popover-close" aria-label="Close">&times;</button>
      </div>
      <div id="profile-popover-body">
        <label class="profile-field">
          <span class="group-label">Nickname</span>
          <input type="text" id="profile-nickname-input" maxlength="20" aria-label="Nickname" />
        </label>
        <div class="cursor-colour-field">
          <span class="cursor-colour-label" id="profile-colour-label">Cursor colour</span>
          <div id="profile-colour-picker" role="group" aria-labelledby="profile-colour-label">
            <input type="color" id="profile-colour-input" />
          </div>
        </div>
        <label class="profile-checkbox-row">
          <input type="checkbox" id="profile-show-nickname" />
          Show my nickname
        </label>
        <label class="profile-checkbox-row">
          <input type="checkbox" id="profile-show-cursor" />
          Show my cursor to others
        </label>
        <label class="profile-checkbox-row">
          <input type="checkbox" id="profile-show-others" />
          Show others' cursors
        </label>
        <div id="profile-popover-actions">
          <button type="button" id="profile-save-button" class="app-button">Save</button>
        </div>
      </div>
    </div>

    <!-- Shown for every mode/scope alike (public/help-popover.js), reusing
         the exact same welcome/about copy public/landing.html's onboarding
         modal shows a new visitor once (public/about-content.js) -- the
         body below is filled in by renderAboutContent(), not hardcoded here,
         so the two can never drift apart. -->
    <div id="help-popover" role="dialog" aria-label="About this site" hidden>
      <div id="help-popover-header">
        <span>About</span>
        <button type="button" id="help-popover-close" aria-label="Close">&times;</button>
      </div>
      <div id="help-popover-body"></div>
    </div>

    <!-- Freehand-only, one-time: shown by public/app.js on first visit (no
         nickname on record yet -- GET /api/me's own nickname is null) and
         never again afterward, since completing it always sets one. Reuses
         the SAME two fields and POST /api/me/profile the Profile popover
         above does; this is just its first-run presentation. -->
    <div id="guest-setup-overlay" hidden>
      <div id="guest-setup-dialog" role="dialog" aria-labelledby="guest-setup-title">
        <div id="guest-setup-header">
          <span id="guest-setup-title">Welcome</span>
        </div>
        <div id="guest-setup-body">
          <p id="guest-setup-message">Choose a nickname and cursor colour so others can see who's drawing.</p>
          <label class="profile-field">
            <span class="group-label">Nickname</span>
            <input type="text" id="guest-setup-nickname-input" maxlength="20" placeholder="Your name" aria-label="Nickname" />
          </label>
          <div class="cursor-colour-field">
            <span class="cursor-colour-label" id="guest-setup-colour-label">Cursor colour</span>
            <div id="guest-setup-colour-picker" role="group" aria-labelledby="guest-setup-colour-label">
              <input type="color" id="guest-setup-colour-input" value="#1e88e5" />
            </div>
          </div>
          <div id="guest-setup-actions">
            <button type="button" id="guest-setup-confirm" class="app-button">Get Started</button>
          </div>
        </div>
      </div>
    </div>

    <div id="tool-cursor" aria-hidden="true"></div>

    <div id="leave-room-overlay" hidden>
      <div id="leave-room-dialog" role="alertdialog" aria-labelledby="leave-room-title" aria-describedby="leave-room-message">
        <div id="leave-room-header">
          <span id="leave-room-title">Leave private room?</span>
        </div>
        <div id="leave-room-body">
          <p id="leave-room-message"></p>
          <div id="leave-room-actions">
            <button type="button" id="leave-room-cancel" class="app-button">Cancel</button>
            <button type="button" id="leave-room-confirm" class="app-button">Leave</button>
          </div>
        </div>
      </div>
    </div>

    <!-- The one entry point for every page (Public and every room): decides
         Public (always pixel now) vs. a room's own kind, then boots the
         pixel editor directly or dynamically imports the untouched legacy
         freehand editor (public/app.js) -- see public/pixel-editor.js's own
         top-level comment. -->
    <script src="/pixel-editor.js" type="module"></script>
  </body>
</html>
