<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shared Canvas</title>
    <link rel="stylesheet" href="/theme-tokens.css" />
    <link rel="stylesheet" href="/shared-ui.css" />
    <link rel="stylesheet" href="/landing.css" />
  </head>
  <body>
    <!-- The actual live Public Canvas, read-only: public/landing-canvas.js
         renders it from the exact same "sync"/"op"/"undo"/"redo" SSE events
         public/app.js's own editor consumes (server/index.js's
         startFreehandStream, completely unchanged for this page's sake).
         pointer-events: none plus simply never wiring any pointer/keyboard
         handler to it (see public/landing.js) is what makes this page
         non-interactive -- there is no drawing/erasing/panning code path
         here at all, not just a disabled one. -->
    <canvas id="landing-canvas" aria-hidden="true"></canvas>

    <!-- Small, local, readable title panel -- never a large panel or a
         page-wide scrim over the canvas: the live artwork must look exactly
         like the real Public Canvas (see public/landing.css's own
         #landing-canvas rule for the fixed white background this relies on),
         so legibility here comes from this one compact panel's own
         background/shadow, not from dimming the canvas underneath it. -->
    <main id="landing-hero">
      <h1 id="landing-title">Shared Canvas</h1>
      <p id="landing-subtitle">A cozy place to draw together.</p>
    </main>

    <!-- A separate, standalone element from #landing-hero (not nested inside
         the title panel) -- its own fixed position lower on the page, with
         the whole canvas visible in between, see public/landing.css. -->
    <div id="landing-cta">
      <button type="button" id="enter-canvas-button" class="app-button app-button-primary">Enter Canvas</button>
    </div>

    <div id="online-counter" class="app-button" aria-live="polite">
      <span id="online-dot" aria-hidden="true"></span>
      <span id="online-count">0</span>
      <span>Online Now</span>
    </div>

    <!-- Site-wide, all-time distinct guest count (server/db.js's
         countTotalVisitors) -- a separate, non-live-dot stat sitting above
         the Online Now counter, same compact .app-button surface. Never
         decreases, unaffected by refreshes/tabs/room switches: see
         public/landing.js's setTotalVisitors. -->
    <div id="total-visitors-counter" class="app-button" aria-live="polite">
      <span id="total-visitors-count">0</span>
      <span>Total Visitors</span>
    </div>

    <!-- The Welcome dialog -- shown every time "Enter Canvas" is clicked,
         for a first-time AND a returning visitor alike (see
         public/landing.js's handleEnterCanvas): the introduction is the same
         either way, only the pre-filled fields and the action button's own
         label ("Start Drawing" vs "Continue Drawing") differ. Reuses the
         exact same two fields and POST /api/me/profile as public/index.html's
         own Profile popover -- one guest identity, one validation contract,
         never a second one just because this is reached from here first. -->
    <div id="onboarding-overlay" hidden>
      <div id="onboarding-dialog" role="dialog" aria-labelledby="onboarding-title">
        <div id="onboarding-about"></div>
        <div id="onboarding-form">
          <label class="onboarding-field">
            <span class="onboarding-label">Nickname</span>
            <input
              type="text"
              id="onboarding-nickname-input"
              maxlength="20"
              placeholder="Your name"
              aria-label="Nickname"
            />
          </label>
          <div class="cursor-colour-field">
            <span class="cursor-colour-label" id="onboarding-colour-label">Cursor colour</span>
            <div id="onboarding-colour-picker" role="group" aria-labelledby="onboarding-colour-label">
              <input type="color" id="onboarding-colour-input" value="#1e88e5" />
            </div>
          </div>
          <button type="button" id="onboarding-start-button" class="app-button app-button-primary">Start Drawing</button>
        </div>
      </div>
    </div>

    <script type="module" src="/landing.js"></script>
  </body>
</html>
